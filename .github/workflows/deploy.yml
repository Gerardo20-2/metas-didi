name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; el más reciente gana
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (React vendor, JSX → js/app.js, Tailwind → css/styles.css)
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html manifest.json sw.js css js icons _site/
          # Cada despliegue estrena caché del Service Worker
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::12}/" _site/sw.js
          ! grep -q "__BUILD_ID__" _site/sw.js
          ls -R _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
