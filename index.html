<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Telemetría financiera y analítica operativa para conductor de plataforma.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DiDiTracker">
    <title>DiDi Analytics &amp; Tracker</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950">
    <div id="root"></div>

    <!-- React servido desde el mismo origen: la app abre sin conexión -->
    <script src="js/vendor/react.production.min.js"></script>
    <script src="js/vendor/react-dom.production.min.js"></script>
    <!-- Compilado desde src/app.jsx con `npm run build` -->
    <script src="js/app.js"></script>

    <script>
        /* Service Worker: solo sobre http(s); abierto con file:// la app funciona sin caché offline */
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function (err) {
                    console.warn('No se pudo registrar el Service Worker', err);
                });
            });
        }
    </script>
</body>
</html>
